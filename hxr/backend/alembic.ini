# Alembic 配置 -- database migrations
#
# RULE: schema changes MUST go through migration scripts.
# Nobody edits table structure by hand. This is the only way to keep
# the schema consistent while three people develop in parallel.
#
# Commands (run in backend/ with the .venv python):
#   create migration (after changing models):
#     .venv\Scripts\python.exe -m alembic revision --autogenerate -m "add xxx"
#   apply to database:
#     .venv\Scripts\python.exe -m alembic upgrade head
#   roll back one step:
#     .venv\Scripts\python.exe -m alembic downgrade -1
#   show current revision:
#     .venv\Scripts\python.exe -m alembic current
#
# NOTE: always review the generated script by hand.
# autogenerate often gets type changes, data migrations and constraint
# removals wrong.
#
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale
# encoding (GBK on this machine), so non-ASCII comments crash it.

[alembic]
script_location = migrations
prepend_sys_path = .
# timestamp prefix keeps migrations readable in chronological order
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
output_encoding = utf-8
# NOTE: no "timezone" setting on purpose. Alembic requires the tzdata package
# for named timezones and we deliberately keep the dependency list short.

# sqlalchemy.url is intentionally empty: migrations/env.py reads it from
# app.config.settings so the connection string lives in exactly one place.
sqlalchemy.url =


[post_write_hooks]
# format generated migrations automatically (ignored if ruff is absent)
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME


# ==================== logging ====================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
