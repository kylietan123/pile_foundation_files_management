<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桩基工程全过程管理文档平台</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- ============ 登录 / 注册 ============ -->
  <div id="view-login" class="view login-view hidden">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">桩</div>
        <h1>桩基工程全过程管理文档平台</h1>
        <p>全过程 · 全阶段 · 全文档</p>
      </div>
      <div class="tabs">
        <button class="tab active" data-mode="login">登录</button>
        <button class="tab" data-mode="register">注册账号</button>
      </div>
      <form id="auth-form" autocomplete="off">
        <label class="field">
          <span>用户名（姓名拼音缩写）</span>
          <input type="text" id="auth-username" placeholder="例如：haoxirui 或 hxr" required />
        </label>
        <label class="field" id="display-name-field" hidden>
          <span>姓名</span>
          <input type="text" id="auth-displayname" placeholder="请输入真实姓名" />
        </label>
        <label class="field">
          <span>密码</span>
          <input type="password" id="auth-password" placeholder="请输入密码" required />
        </label>
        <p class="form-error" id="auth-error"></p>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit">登 录</button>
      </form>
    </div>
  </div>

  <!-- ============ 工作台 ============ -->
  <div id="view-workbench" class="view hidden">
    <header class="topbar">
      <div class="topbar-brand">
        <div class="brand-mark small">桩</div>
        <span>桩基工程全过程管理文档平台</span>
      </div>
      <div class="topbar-user">
        <span class="user-name" id="workbench-username"></span>
        <button class="btn btn-ghost" id="btn-change-password">修改密码</button>
        <button class="btn btn-ghost" id="btn-manage-users" hidden>用户管理</button>
        <button class="btn btn-ghost" id="btn-logout">退出登录</button>
      </div>
    </header>

    <main class="workbench">
      <div class="workbench-head">
        <div>
          <h2>工作台</h2>
          <p class="muted">管理你名下的桩基工程项目与全过程文档</p>
        </div>
        <button class="btn btn-primary" id="btn-new-project">＋ 新建项目</button>
      </div>

      <div id="project-empty" class="empty-state hidden">
        <div class="empty-icon">🗂️</div>
        <p>还没有任何项目</p>
        <p class="muted">点击下方按钮，创建你的第一个桩基工程项目</p>
        <button class="btn btn-primary" id="btn-new-project-empty">＋ 新建项目</button>
      </div>

      <div id="project-grid" class="project-grid"></div>
    </main>
  </div>

  <!-- ============ 项目详情 ============ -->
  <div id="view-project" class="view hidden">
    <header class="topbar">
      <div class="topbar-brand">
        <button class="btn btn-ghost" id="btn-back">← 返回工作台</button>
        <span class="project-title" id="project-title"></span>
      </div>
      <div class="topbar-user">
        <button class="btn btn-ghost" id="btn-edit-project">编辑项目</button>
        <button class="btn btn-ghost danger" id="btn-delete-project">删除项目</button>
      </div>
    </header>

    <div class="project-layout">
      <aside class="stage-sidebar">
        <div class="stage-sidebar-title">七个阶段</div>
        <nav id="stage-nav"></nav>
      </aside>

      <main class="stage-content" id="stage-content">
        <!-- 由 JS 渲染 -->
      </main>
    </div>
  </div>

  <!-- ============ 弹窗 ============ -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal-box"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/app.js"></script>
</body>
</html>
